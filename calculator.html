<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realme UI Clean Bubble Glass Calculator</title>
    <!-- Tailwind CSS Standard CDN v3 (Fixes the white screen issue) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            user-select: none;
            -webkit-user-select: none;
        }
        /* Dynamic Edge Lighting Class */
        .edge-glow-active {
            box-shadow: inset 0 0 35px 8px rgba(0, 122, 255, 0.85), 
                        0 0 25px 6px rgba(0, 122, 255, 0.6) !important;
            transition: all 0.1s ease-out;
        }
        /* Range Slider Styling */
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #007aff;
            cursor: pointer;
        }
        .scrollbar-none::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body id="app-body" class="h-screen w-screen flex flex-col justify-between overflow-hidden relative p-6 bg-[#111214]">

    <!-- BACKGROUND WALLPAPERS -->
    <div id="bg-overlay" class="absolute inset-0 z-0 opacity-40 transition-all duration-500" style="background: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1964&auto=format&fit=crop') center/cover;"></div>

    <!-- TOP HEADER BAR (Clean Layout) -->
    <div class="w-full flex justify-between items-center z-10 text-white/90 px-2 pt-2">
        <button class="p-2 bg-white/5 rounded-full active:scale-95 transition-transform backdrop-blur-md border border-white/10">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 1121.253 8H18" /></svg>
        </button>
        <div class="flex items-center gap-4">
            <!-- Share Icon Button -->
            <button id="share-btn" class="p-2.5 bg-white/5 hover:bg-white/15 rounded-full active:scale-95 cursor-pointer transition-all backdrop-blur-md border border-white/10" title="Share Result">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 opacity-90" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z" /></svg>
            </button>
            <!-- Settings Menu Button -->
            <button id="open-settings" class="p-2.5 bg-white/5 hover:bg-white/15 rounded-full active:scale-95 cursor-pointer transition-all backdrop-blur-md border border-white/10">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 opacity-90" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v.01M12 12v.01M12 19v.01" /></svg>
            </button>
        </div>
    </div>

    <!-- MATCHING BLUR GLASS SETTINGS DRAWER -->
    <div id="settings-drawer" class="fixed top-0 right-0 h-full w-[340px] shadow-2xl z-50 transform translate-x-full transition-transform duration-300 ease-in-out flex flex-col border-l border-white/10 backdrop-blur-xl">
        <div class="border-b border-white/10 px-5 py-4 flex items-center justify-between shadow-sm bg-black/10">
            <h1 id="drawer-title" class="text-md font-semibold text-white">Calculator Settings</h1>
            <button id="close-settings" class="text-white/60 hover:text-white p-1 cursor-pointer rounded-full hover:bg-white/10 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
            </button>
        </div>
        
        <div class="p-5 flex-1 overflow-y-auto space-y-5 scrollbar-none">
            <!-- HISTORY & REMINDERS PANEL -->
            <div id="panel-history" class="bg-white/5 rounded-2xl p-4 border border-white/10 flex flex-col">
                <div class="flex justify-between items-center mb-3">
                    <h2 id="sub-title-1" class="text-xs font-semibold text-white/50 uppercase tracking-wider">Saved Logs & Reminders</h2>
                    <button id="clear-history" class="text-xs text-red-400 hover:text-red-500 hover:underline cursor-pointer">Clear All</button>
                </div>
                <div id="history-list" class="space-y-2.5 max-h-[220px] overflow-y-auto pr-1 scrollbar-none text-sm">
                    <p class="text-xs text-white/40 italic text-center py-2">No active logs or reminders</p>
                </div>
            </div>

            <!-- THEME MODE SYSTEM -->
            <div id="panel-theme" class="bg-white/5 rounded-2xl p-4 border border-white/10">
                <h2 id="sub-title-2" class="text-xs font-semibold text-white/50 uppercase tracking-wider mb-3">Theme Mode</h2>
                <div class="grid grid-cols-2 gap-3">
                    <button id="mode-day" class="p-2.5 border border-white/10 rounded-xl font-medium text-sm text-white/70 hover:bg-white/10 transition-all cursor-pointer">Day Mode</button>
                    <button id="mode-night" class="p-2.5 border border-[#007aff] bg-blue-500/20 rounded-xl font-medium text-sm text-[#007aff] transition-all cursor-pointer">Night Mode</button>
                </div>
            </div>

            <!-- GLASS SLIDERS -->
            <div id="panel-sliders" class="bg-white/5 rounded-2xl p-4 border border-white/10 space-y-4">
                <h2 id="sub-title-3" class="text-xs font-semibold text-white/50 uppercase tracking-wider">Glass Engine Config</h2>
                <div>
                    <div class="flex justify-between text-xs text-white/70 mb-1"><span>Blur Intensity</span><span id="blur-val" class="text-[#007aff]">12px</span></div>
                    <input type="range" id="blur" min="0" max="30" value="12" class="w-full accent-[#007aff] h-1 bg-white/10 rounded-lg cursor-pointer">
                </div>
                <div>
                    <div class="flex justify-between text-xs text-white/70 mb-1"><span>Bubble Opacity</span><span id="opacity-val" class="text-[#007aff]">0.12</span></div>
                    <input type="range" id="opacity" min="0" max="1" step="0.01" value="0.12" class="w-full accent-[#007aff] h-1 bg-white/10 rounded-lg cursor-pointer">
                </div>
            </div>
        </div>
    </div>

    <!-- CALCULATOR SCREEN DISPLAY DESIGN -->
    <div class="w-full flex-1 flex flex-col justify-end items-end px-4 z-10 relative">
        <!-- Live Preview Text -->
        <div id="live-preview" class="text-xl text-white/30 font-light tracking-wide min-h-[32px] transition-all font-mono opacity-70 mb-1"></div>
        <!-- Main Realtime Input Display -->
        <div id="calc-display" class="text-5xl font-light text-white tracking-wide truncate max-w-full mb-2">0</div>

        <!-- SMALL REMINDER BUBBLE TRIGGER BUTTON -->
        <div id="bubble-trigger-zone" class="hidden h-10 mb-2 transition-all duration-300">
            <button id="open-reminder-modal" class="flex items-center gap-1.5 bg-blue-600/80 hover:bg-blue-600 text-white text-xs font-medium px-3 py-1.5 rounded-full shadow-lg backdrop-blur-md active:scale-95 transition-all border border-white/10 cursor-pointer">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" /></svg>
                <span>Set Reminder</span>
            </button>
        </div>

        <!-- INTEGRATED SMALL BUBBLE OVERLAY MODAL -->
        <div id="reminder-modal" class="hidden absolute bottom-2 right-2 bg-slate-900/90 backdrop-blur-xl p-4 rounded-2xl border border-white/15 w-[260px] flex flex-col gap-3 shadow-2xl z-40">
            <div class="flex justify-between items-center">
                <span class="text-xs font-semibold text-white/80">Configure Reminder</span>
                <button id="close-reminder-modal" class="text-white/40 hover:text-white text-xs cursor-pointer">✕</button>
            </div>
            <input type="text" id="calc-name" placeholder="Label Name (e.g. Rent)" class="w-full bg-white/10 text-white placeholder-white/30 px-3 py-1.5 rounded-xl text-xs border border-white/10 outline-none">
            <div class="flex gap-2">
                <input type="number" id="rem-hours" placeholder="Hours" min="0" class="w-1/2 bg-white/10 text-white placeholder-white/30 px-2 py-1.5 rounded-xl text-xs border border-white/10 outline-none text-center">
                <input type="number" id="rem-mins" placeholder="Mins" min="0" class="w-1/2 bg-white/10 text-white placeholder-white/30 px-2 py-1.5 rounded-xl text-xs border border-white/10 outline-none text-center">
            </div>
            <button id="save-btn" class="w-full bg-green-600 hover:bg-green-500 text-white font-medium py-1.5 rounded-xl text-xs transition-colors cursor-pointer">Confirm & Save</button>
        </div>
    </div>

    <!-- 🫧 CLEAN BUBBLE GLASS KEYPAD MATRIX -->
    <div id="keyboard" class="w-full z-10 grid grid-cols-4 gap-4 pt-4 pb-4 text-white">
        <!-- AC Customized with Dark Red -->
        <button data-action="clear" id="btn-ac" class="aspect-square flex items-center justify-center text-xl font-medium rounded-full transition-all duration-75 active:scale-90 cursor-pointer shadow-sm bg-[#b91c1c] text-white">AC</button>
        <button data-action="operator" data-val="%" class="aspect-square flex items-center justify-center text-xl font-medium rounded-full transition-all duration-75 active:scale-90 cursor-pointer shadow-sm">%</button>
        <button data-action="backspace" class="aspect-square flex items-center justify-center text-xl font-medium rounded-full transition-all duration-75 active:scale-90 cursor-pointer shadow-sm">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2M3 12l6.414 6.414A2 2 0 0010.828 19H19a2 2 0 002-2V7a2 2 0 00-2-2h-8.172a2 2 0 00-1.414.586L3 12z" /></svg>
        </button>
        <button data-action="operator" data-val="/" class="aspect-square flex items-center justify-center text-2xl font-light rounded-full transition-all duration-75 active:scale-90 cursor-pointer shadow-sm">÷</button>

        <!-- Row 2 -->
        <button data-action="num" data-val="7" class="aspect-square flex items-center justify-center text-2xl font-medium rounded-full transition-all duration-75 active:scale-90 cursor-pointer shadow-sm">7</button>
        <button data-action="num" data-val="8" class="aspect-square flex items-center justify-center text-2xl font-medium rounded-full transition-all duration-75 active:scale-90 cursor-pointer shadow-sm">8</button>
        <button data-action="num" data-val="9" class="aspect-square flex items-center justify-center text-2xl font-medium rounded-full transition-all duration-75 active:scale-90 cursor-pointer shadow-sm">9</button>
        <button data-action="operator" data-val="*" class="aspect-square flex items-center justify-center text-2xl font-light rounded-full transition-all duration-75 active:scale-90 cursor-pointer shadow-sm">×</button>

        <!-- Row 3 -->
        <button data-action="num" data-val="4" class="aspect-square flex items-center justify-center text-2xl font-medium rounded-full transition-all duration-75 active:scale-90 cursor-pointer shadow-sm">4</button>
        <button data-action="num" data-val="5" class="aspect-square flex items-center justify-center text-2xl font-medium rounded-full transition-all duration-75 active:scale-90 cursor-pointer shadow-sm">5</button>
        <button data-action="num" data-val="6" class="aspect-square flex items-center justify-center text-2xl font-medium rounded-full transition-all duration-75 active:scale-90 cursor-pointer shadow-sm">6</button>
        <button data-action="operator" data-val="-" class="aspect-square flex items-center justify-center text-3xl font-light rounded-full transition-all duration-75 active:scale-90 cursor-pointer shadow-sm">-</button>

        <!-- Row 4 -->
        <button data-action="num" data-val="1" class="aspect-square flex items-center justify-center text-2xl font-medium rounded-full transition-all duration-75 active:scale-90 cursor-pointer shadow-sm">1</button>
        <button data-action="num" data-val="2" class="aspect-square flex items-center justify-center text-2xl font-medium rounded-full transition-all duration-75 active:scale-90 cursor-pointer shadow-sm">2</button>
        <button data-action="num" data-val="3" class="aspect-square flex items-center justify-center text-2xl font-medium rounded-full transition-all duration-75 active:scale-90 cursor-pointer shadow-sm">3</button>
        <button data-action="operator" data-val="+" class="aspect-square flex items-center justify-center text-2xl font-light rounded-full transition-all duration-75 active:scale-90 cursor-pointer shadow-sm">+</button>

        <!-- Row 5: Equals Customized with Vibrant Green -->
        <button data-action="num" data-val="00" class="aspect-square flex items-center justify-center text-2xl font-medium rounded-full transition-all duration-75 active:scale-90 cursor-pointer shadow-sm">00</button>
        <button data-action="num" data-val="0" class="aspect-square flex items-center justify-center text-2xl font-medium rounded-full transition-all duration-75 active:scale-90 cursor-pointer shadow-sm">0</button>
        <button data-action="num" data-val="." class="aspect-square flex items-center justify-center text-2xl font-medium rounded-full transition-all duration-75 active:scale-90 cursor-pointer shadow-sm">.</button>
        <button data-action="equals" class="aspect-square flex items-center justify-center text-3xl font-light rounded-full bg-[#16a34a] text-white transition-all duration-75 active:scale-90 cursor-pointer shadow-lg shadow-green-600/20">=</button>
    </div>

    <!-- SCRIPT INFRASTRUCTURE ENGINE -->
    <script>
        // Drawer Navigation Settings
        const drawer = document.getElementById('settings-drawer');
        document.getElementById('open-settings').addEventListener('click', () => drawer.classList.remove('translate-x-full'));
        document.getElementById('close-settings').addEventListener('click', () => drawer.classList.add('translate-x-full'));

        // Bubble Modal Toggles
        const bubbleTriggerZone = document.getElementById('bubble-trigger-zone');
        const reminderModal = document.getElementById('reminder-modal');
        
        document.getElementById('open-reminder-modal').addEventListener('click', () => reminderModal.classList.remove('hidden'));
        document.getElementById('close-reminder-modal').addEventListener('click', () => reminderModal.classList.add('hidden'));

        // Customizer Controls
        const appBody = document.getElementById('app-body');
        const bgOverlay = document.getElementById('bg-overlay');
        const blurInput = document.getElementById('blur');
        const opacityInput = document.getElementById('opacity');
        const blurVal = document.getElementById('blur-val');
        const opacityVal = document.getElementById('opacity-val');

        const drawerTitle = document.getElementById('drawer-title');
        const subTitle1 = document.getElementById('sub-title-1');
        const subTitle2 = document.getElementById('sub-title-2');
        const subTitle3 = document.getElementById('sub-title-3');

        let isNightMode = true; 
        let glassRGB = "255, 255, 255"; 
        let databaseLogs = [];

        function updateGlassStyles() {
            const blur = blurInput.value;
            const opacity = opacityInput.value;
            blurVal.innerText = `${blur}px`;
            opacityVal.innerText = opacity;

            // Apply glass styles (Except red AC and green equals)
            const targetButtons = document.querySelectorAll('#keyboard button:not([data-action="equals"]):not([data-action="clear"])');
            targetButtons.forEach(btn => {
                btn.style.backgroundColor = `rgba(${glassRGB}, ${opacity})`;
                btn.style.backdropFilter = `blur(${blur}px)`;
                btn.style.webkitBackdropFilter = `blur(${blur}px)`;
                btn.style.borderColor = `rgba(${glassRGB}, 0.15)`;
            });

            if(isNightMode) {
                drawer.style.backgroundColor = `rgba(30, 41, 59, 0.45)`;
            } else {
                drawer.style.backgroundColor = `rgba(255, 255, 255, 0.55)`;
            }
            drawer.style.backdropFilter = `blur(${parseInt(blur) + 8}px)`;
            drawer.style.webkitBackdropFilter = `blur(${parseInt(blur) + 8}px)`;
        }

        [blurInput, opacityInput].forEach(element => element.addEventListener('input', updateGlassStyles));

        // Theme Switchers
        const btnDay = document.getElementById('mode-day');
        const btnNight = document.getElementById('mode-night');

        btnDay.addEventListener('click', () => {
            isNightMode = false; glassRGB = "0, 0, 0";
            appBody.classList.replace('bg-[#111214]', 'bg-[#f4f5f7]');
            document.getElementById('calc-display').classList.replace('text-white', 'text-black');
            document.getElementById('live-preview').classList.replace('text-white/30', 'text-black/30');
            bgOverlay.style.opacity = "0.1";
            
            drawerTitle.className = "text-md font-semibold text-gray-800";
            document.getElementById('close-settings').className = "text-gray-600 hover:text-black p-1 cursor-pointer rounded-full hover:bg-black/5";
            [subTitle1, subTitle2, subTitle3].forEach(el => el.className = "text-xs font-semibold text-gray-400 uppercase tracking-wider");

            btnDay.className = "p-2.5 border border-[#007aff] bg-blue-500/10 rounded-xl font-medium text-sm text-[#007aff] cursor-pointer";
            btnNight.className = "p-2.5 border border-gray-300 rounded-xl font-medium text-sm text-gray-500 cursor-pointer";
            updateGlassStyles();
            renderHistoryListUI();
        });

        btnNight.addEventListener('click', () => {
            isNightMode = true; glassRGB = "255, 255, 255";
            appBody.classList.replace('bg-[#f4f5f7]', 'bg-[#111214]');
            document.getElementById('calc-display').classList.replace('text-black', 'text-white');
            document.getElementById('live-preview').classList.replace('text-black/30', 'text-white/30');
            bgOverlay.style.opacity = "0.4";

            drawerTitle.className = "text-md font-semibold text-white";
            document.getElementById('close-settings').className = "text-white/60 hover:text-white p-1 cursor-pointer rounded-full hover:bg-white/10";
            [subTitle1, subTitle2, subTitle3].forEach(el => el.className = "text-xs font-semibold text-white/50 uppercase tracking-wider");

            btnNight.className = "p-2.5 border border-[#007aff] bg-blue-500/20 rounded-xl font-medium text-sm text-[#007aff] cursor-pointer";
            btnDay.className = "p-2.5 border border-white/10 rounded-xl font-medium text-sm text-white/70 cursor-pointer";
            updateGlassStyles();
            renderHistoryListUI();
        });

        function executeEdgeGlow() {
            appBody.classList.add('edge-glow-active');
            setTimeout(() => { appBody.classList.remove('edge-glow-active'); }, 180);
        }

        // --- MATH CALCULATOR ENGINE ---
        const mainDisplay = document.getElementById('calc-display');
        const livePreview = document.getElementById('live-preview');
        const historyList = document.getElementById('history-list');
        
        let currentInput = "0";

        function updateLiveCountPreview() {
            const lastChar = currentInput.slice(-1);
            if (["+", "-", "*", "/", "%"].includes(lastChar) || currentInput === "0") {
                livePreview.innerText = "";
                return;
            }
            try {
                let instantCalculation = eval(currentInput);
                if (instantCalculation.toString() !== currentInput) {
                    livePreview.innerText = "= " + Number(instantCalculation.toFixed(4)).toString();
                } else {
                    livePreview.innerText = "";
                }
            } catch {
                livePreview.innerText = "";
            }
        }

        document.getElementById('keyboard').addEventListener('click', (e) => {
            const currentButton = e.target.closest('button');
            if (!currentButton) return;

            executeEdgeGlow();
            const action = currentButton.dataset.action;
            const value = currentButton.dataset.val;

            if (action === 'num') {
                if (currentInput === "0" && value !== ".") {
                    currentInput = value;
                } else {
                    if (value === ".") {
                        const numericSegments = currentInput.split(/[\+\-\*\/%]/);
                        if (numericSegments[numericSegments.length - 1].includes(".")) return;
                    }
                    currentInput += value;
                }
                mainDisplay.innerText = currentInput;
                bubbleTriggerZone.classList.add('hidden'); 
                reminderModal.classList.add('hidden');
                updateLiveCountPreview();
            } 
            else if (action === 'operator') {
                const lastChar = currentInput.slice(-1);
                if (["+", "-", "*", "/", "%"].includes(lastChar)) {
                    currentInput = currentInput.slice(0, -1) + value;
                } else {
                    currentInput += value;
                }
                mainDisplay.innerText = currentInput;
                bubbleTriggerZone.classList.add('hidden');
                reminderModal.classList.add('hidden');
                updateLiveCountPreview();
            } 
            else if (action === 'clear') {
                currentInput = "0";
                mainDisplay.innerText = "0";
                livePreview.innerText = "";
                bubbleTriggerZone.classList.add('hidden');
                reminderModal.classList.add('hidden');
            } 
            else if (action === 'backspace') {
                if (currentInput.length > 1) {
                    currentInput = currentInput.slice(0, -1);
                } else {
                    currentInput = "0";
                }
                mainDisplay.innerText = currentInput;
                bubbleTriggerZone.classList.add('hidden');
                reminderModal.classList.add('hidden');
                updateLiveCountPreview();
            } 
            else if (action === 'equals') {
                try {
                    let rawExpression = currentInput;
                    let finalEvalResult = eval(rawExpression);
                    let formattedStringResult = Number(finalEvalResult.toFixed(6)).toString();

                    mainDisplay.innerText = formattedStringResult;
                    livePreview.innerText = rawExpression; 

                    if (rawExpression !== formattedStringResult) {
                        bubbleTriggerZone.classList.remove('hidden'); 
                    }
                } catch {
                    mainDisplay.innerText = "Error";
                    currentInput = "0";
                }
            }
        });

        // --- BUBBLE SAVE & TIMER LOGIC ---
        document.getElementById('save-btn').addEventListener('click', () => {
            const labelName = document.getElementById('calc-name').value.trim() || "Task Check";
            const calculatedValue = mainDisplay.innerText;
            const hours = parseInt(document.getElementById('rem-hours').value) || 0;
            const mins = parseInt(document.getElementById('rem-mins').value) || 0;

            const totalMs = ((hours * 60) + mins) * 60 * 1000;
            let reminderStatusText = "No Reminder";

            if (totalMs > 0) {
                reminderStatusText = `🔔 Active: ${hours}h ${mins}m`;
                
                setTimeout(() => {
                    alert(`⏰ REALME REMINDER\n\nTask: ${labelName}\nValue: ${calculatedValue}`);
                }, totalMs);
            }

            databaseLogs.unshift({
                id: Date.now(),
                name: labelName,
                expression: livePreview.innerText,
                value: calculatedValue,
                reminder: reminderStatusText
            });

            // Reset Bubble Panel State
            document.getElementById('calc-name').value = "";
            document.getElementById('rem-hours').value = "";
            document.getElementById('rem-mins').value = "";
            reminderModal.classList.add('hidden');
            bubbleTriggerZone.classList.add('hidden');

            renderHistoryListUI();
        });

        function renderHistoryListUI() {
            if (databaseLogs.length === 0) {
                historyList.innerHTML = `<p class="text-xs text-center py-2 italic ${isNightMode ? 'text-white/40' : 'text-gray-400'}">No active logs</p>`;
                return;
            }

            historyList.innerHTML = databaseLogs.map(log => `
                <div class="${isNightMode ? 'bg-white/5 border-white/10 text-white' : 'bg-black/5 border-black/5 text-gray-900'} p-3 rounded-xl border flex flex-col justify-between mt-2">
                    <div class="flex justify-between items-start">
                        <span class="font-semibold text-xs truncate max-w-[140px]">${log.name}</span>
                        <span class="text-[10px] ${isNightMode ? 'bg-blue-500/20 text-blue-400' : 'bg-blue-600/10 text-blue-600'} px-2 py-0.5 rounded-md font-medium font-mono">${log.reminder}</span>
                    </div>
                    <div class="text-[10px] ${isNightMode ? 'text-white/40' : 'text-gray-500'} mt-1 font-mono truncate">${log.expression}</div>
                    <div class="text-right font-bold text-sm font-mono mt-0.5">= ${log.value}</div>
                </div>
            `).join('');
        }

        document.getElementById('clear-history').addEventListener('click', () => {
            databaseLogs = [];
            renderHistoryListUI();
        });

        // Share clipboard system
        document.getElementById('share-btn').addEventListener('click', () => {
            const copyContent = `Result: ${mainDisplay.innerText} (${livePreview.innerText || 'Direct'})`;
            navigator.clipboard.writeText(copyContent).then(() => alert("Copied to clipboard!"));
        });

        updateGlassStyles();
    </script>
</body>
</html>
